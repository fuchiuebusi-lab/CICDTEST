version: 0.2

env:
  variables:
    SNS_TOPIC_ARN: ""

phases:
  build:
    commands:
      - |
        set -eu
        API=https://api.github.com/repos/$GITHUB_REPOSITORY
        # リリース番号が取れなかった場合（タグ付与の失敗など）はコミットIDで名前を付ける
        NAME="$RELEASE_TAG"
        if [ -z "$NAME" ] || [ "$NAME" = "none" ]; then
          NAME="prd-$(echo "$COMMIT_ID" | cut -c1-8)"
        fi
        BRANCH="release/$NAME"
        echo "main同期: $BRANCH <- $COMMIT_ID"

        # GitHub Appのインストールトークンを取得（JWTをRS256で署名）
        b64url () { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
        # Secrets Managerへの登録で改行が空白や「\n」の文字に変わっていても読めるよう、PEMを組み立て直す
        KEY_TYPE=$(printf '%s' "$GH_APP_PRIVATE_KEY" | sed -n 's/.*-----BEGIN \([A-Z ]*\)-----.*/\1/p' | head -1)
        KEY_BODY=$(printf '%s' "$GH_APP_PRIVATE_KEY" | sed 's/\\n/ /g' | tr '\n' ' ' | sed 's/-----[A-Z ]*-----//g' | tr -d ' \r\t')
        { echo "-----BEGIN $KEY_TYPE-----"; echo "$KEY_BODY" | fold -w 64; echo "-----END $KEY_TYPE-----"; } > app-key.pem
        NOW=$(date +%s)
        HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
        PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((NOW - 60)) $((NOW + 540)) "$GH_APP_ID" | b64url)
        SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign app-key.pem | b64url)
        rm -f app-key.pem
        TOKEN=$(curl -sf -X POST \
          -H "Authorization: Bearer $HEADER.$PAYLOAD.$SIGNATURE" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/app/installations/$GH_INSTALLATION_ID/access_tokens" | jq -r .token)
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "GitHub Appのトークン取得に失敗"; exit 1; fi
        gh_api () { # 引数: メソッド パス JSON
          curl -s -o response.json -w '%{http_code}' -X "$1" \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API$2" -d "$3"
        }

        # 1. ブランチ作成（再実行時など、既にあれば422になるのでそのまま進む）
        CODE=$(gh_api POST /git/refs "$(jq -n --arg r "refs/heads/$BRANCH" --arg s "$COMMIT_ID" '{ref:$r,sha:$s}')")
        case "$CODE" in 201|422) echo "ブランチ: $CODE" ;; *) cat response.json; exit 1 ;; esac

        # 2. Gitタグ作成（リリース番号が取れた場合のみ）
        if [ "$NAME" = "$RELEASE_TAG" ]; then
          CODE=$(gh_api POST /git/refs "$(jq -n --arg r "refs/tags/$NAME" --arg s "$COMMIT_ID" '{ref:$r,sha:$s}')")
          case "$CODE" in 201|422) echo "タグ: $CODE" ;; *) cat response.json; exit 1 ;; esac
        fi

        # 3. mainへのPR作成（既に同じPRがあれば422）
        BODY=$(printf '本番リリース %s（コミット %s）をmainに同期するPRです。\nマージは「Create a merge commit」で行ってください。' "$NAME" "$COMMIT_ID")
        CODE=$(gh_api POST /pulls "$(jq -n --arg t "本番リリース $NAME をmainへ同期" --arg h "$BRANCH" --arg b "$BODY" \
          '{title:$t,head:$h,base:"main",body:$b}')")
        case "$CODE" in
          201) PR_URL=$(jq -r .html_url response.json) ;;
          422) PR_URL="（既存のPRあり）https://github.com/$GITHUB_REPOSITORY/pulls" ; cat response.json ;;
          *) cat response.json; exit 1 ;;
        esac
        echo "PR: $PR_URL"

        # 4. Slack通知（Chatbotのカスタム通知形式）
        if [ -n "$SNS_TOPIC_ARN" ]; then
          aws sns publish --topic-arn "$SNS_TOPIC_ARN" --message "$(jq -n --arg d "本番リリース $NAME のmain同期PRを作成しました。リリース後の確認が終わったらマージしてください: $PR_URL" \
            '{version:"1.0",source:"custom",content:{description:$d}}')" > /dev/null
        fi
